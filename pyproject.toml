[project]
name = "emotional-intelligence"
version = "0.1.0"
description = "Local-only body-language and emotional-state signals for desktop agents, exposed over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "numpy>=2.1",
    "ollama>=0.6",
    "opencv-python-headless>=4.11",
    "pydantic>=2.10",
]

[project.scripts]
ei = "ei.cli:main"
ei-daemon = "ei.daemon:main"
ei-mcp = "ei.mcp_server:main"
ei-hook = "ei.hook:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.400",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ei"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
